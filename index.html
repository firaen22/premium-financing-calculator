<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Private Wealth | Premium Financing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Playfair Display', serif;
      }
      * {
        box-sizing: border-box;
      }
      /* The app uses `animate-in fade-in` in 6 places and `animate-in slide-in-from-top-4` in 1 place.
         Those come from the tailwindcss-animate plugin, which the Tailwind Play CDN
         does not include, so they were resolving to no animation at all. The plugin
         is deliberately not installed because it has no easing, no fill-mode, no
         reduced-motion guard, and its slide-in doesn't fade. These keyframes make
         the existing classes behave as written. */
      @keyframes cc-fade-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes cc-slide-in-top-4 { from { opacity: 0; transform: translateY(-1rem) } to { opacity: 1; transform: none } }
      .animate-in { animation-duration: .3s; animation-timing-function: cubic-bezier(.4,0,.2,1); animation-fill-mode: both; }
      .animate-in.fade-in { animation-name: cc-fade-in; }
      .animate-in.slide-in-from-top-4 { animation-name: cc-slide-in-top-4; }
      .animate-in.duration-500 { animation-duration: .5s }
      .animate-in.duration-700 { animation-duration: .7s }
      @media (prefers-reduced-motion: reduce) {
        .animate-in { animation: none !important; }
      }
      /* Stop iOS Safari inflating text in landscape, and keep long figures from
         forcing the 360px viewport wider. */
      html { -webkit-text-size-adjust: 100%; }
      body { overflow-x: hidden; overscroll-behavior-y: none; }
      /* Custom Scrollbar for a premium feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
